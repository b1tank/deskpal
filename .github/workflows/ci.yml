name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  safe-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap dbus-x11 gcc imagemagick meson ninja-build \
            python3-gi python3-tk tesseract-ocr x11-utils xauth xdotool xvfb \
            libatspi2.0-dev libdbus-1-dev libglib2.0-dev libleptonica-dev \
            libpng-dev libtesseract-dev libx11-dev libx11-xcb-dev \
            libxcb-shm0-dev libxcb1-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - name: Deterministic protocol and isolation checks
        run: |
          npm run test:extension
          npm run test:indicator
          npm run test:shell-bridge
          npm run test:broker-contract
          npm run test:frame-state
          npm run test:isolation
          npm run test:accessibility
